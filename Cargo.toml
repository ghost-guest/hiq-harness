[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/guards",
    "crates/context",
    "crates/memory",
    "crates/persist",
    "crates/orchestrate",
    "crates/plugin",
    "crates/cli",
    "crates/desktop",
    "crates/harnessd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
